sonar.projectKey=mvc_php
sonar.projectName=My MVC Project (PHP 8.5+)
sonar.projectVersion=2.4.0

# Source & Test Directories
sonar.sources=app,core,database,routes
sonar.exclusions=vendor/**,public/build/**,node_modules/**,storage/**

# PHP 8.5+ Target & Encoding
sonar.language=php
sonar.php.version=8.5
sonar.php.file.suffixes=php
sonar.sourceEncoding=UTF-8

# Quality & Security Report Paths (Optional CI/CD Integration)
sonar.php.tests.reportPath=storage/logs/junit.xml
sonar.php.coverage.reportPaths=storage/logs/clover.xml
