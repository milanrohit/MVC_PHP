
; ==========================================================
; PHP 8.5.12 + Apache - Production OPcache
; ==========================================================

; Enable OPcache for web requests, not CLI commands
opcache.enable=1
opcache.enable_cli=0

; Shared memory and interned strings
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Production: PHP files are updated through new deployments
opcache.validate_timestamps=0

; Retain comments needed by frameworks and annotations
opcache.save_comments=1

; Avoid filename collisions between different directories
opcache.use_cwd=1

; Keep conservative file-existence behavior
opcache.enable_file_override=0

; Cache memory management
opcache.max_wasted_percentage=10

; Prevent caching files that are still being written
opcache.file_update_protection=2

; Basic OPcache logging
opcache.log_verbosity_level=1
