; ==============================================================================
; PHP 8.6 Security & Anti-Webshell (php2shell) Hardening
; Copy into the PRODUCTION stage only (Composer/CLI build tooling must not
; inherit open_basedir / disable_functions).
; Lines marked [NEW] were added in this review; [TEST] = may break an app that
; relies on the feature, verify before shipping.
; ==============================================================================

; 1. Block Information Disclosure
expose_php = Off
display_errors = Off
display_startup_errors = Off
html_errors = Off                         ; [NEW]
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log
zend.exception_ignore_args = On           ; [NEW] keep args/secrets out of stack traces
zend.assertions = -1                      ; [NEW] assertions fully compiled out

; 2. Block Remote File Inclusion & Dangerous Wrappers
allow_url_fopen = Off
allow_url_include = Off
enable_dl = Off

; 3. Block Webshell / OS Command Execution Functions
; Note: the backtick operator calls shell_exec, so it is blocked too.
; eval() is a language construct and CANNOT be disabled here.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,curl_multi_exec,parse_ini_file,show_source,highlight_file,phpinfo,proc_close,proc_get_status,proc_terminate,proc_nice,symlink,link,putenv,posix_kill,posix_mkfifo,posix_setuid,posix_setgid,posix_setsid,posix_setpgid,posix_getpwnam,posix_getpwuid,apache_child_terminate,apache_setenv,virtual

; [TEST] Also consider, ONLY if the app does not use them:
;   mail,mb_send_mail            (SMTP libraries are unaffected)
;   curl_exec                    (outbound HTTP; you block curl_multi_exec but not curl_exec)
; Reverse-shell primitives (breaks SMTP/Redis/HTTP client libs that use sockets):
;   fsockopen,pfsockopen,stream_socket_client,stream_socket_server,stream_socket_pair

; 4. Restrict Filesystem Access to App & Temp Directories
; open_basedir is defence-in-depth, not a hard sandbox.
open_basedir = /var/www/html:/tmp:/usr/local/lib/php:/.dockerenv

; 5. Session & Upload Progress Hardening
session.upload_progress.enabled = Off
session.use_strict_mode = On
session.use_only_cookies = On
session.use_trans_sid = Off               ; [NEW]
session.cookie_httponly = On
session.cookie_secure = On                ; [NEW] requires HTTPS at the browser (TLS may end at a proxy)
; [TEST] "Strict" drops the cookie on the first request when a user arrives from an
; external link or SSO redirect. Use "Lax" if you have SSO / emailed links.
session.cookie_samesite = "Strict"

; 6. Resource limits (DoS / abuse) [NEW]
max_execution_time = 30
max_input_time = 60
max_input_vars = 1000
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M
max_file_uploads = 5
; file_uploads = Off                      ; uncomment if the app has no uploads
