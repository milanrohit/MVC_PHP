; ==============================================================================
; PHP 8.6 Security & Anti-Webshell (php2shell) Hardening
; Copy into the PRODUCTION stage only (Composer/CLI build tooling must not
; inherit open_basedir / disable_functions).
; ==============================================================================

; 1. Block Information Disclosure
expose_php = Off
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log
zend.exception_ignore_args = On
zend.assertions = -1

; 2. Block Remote File Inclusion & Dangerous Wrappers
allow_url_fopen = Off
allow_url_include = Off
enable_dl = Off

; 3. Block Webshell & OS Command Execution Functions
; Note: backtick operator calls shell_exec, so it is blocked too.
; eval() is a language construct and cannot be disabled here.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_alarm,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_get_last_error,pcntl_strerror,dl,curl_multi_exec,parse_ini_file,show_source,highlight_file,phpinfo,proc_close,proc_get_status,proc_terminate,proc_nice,symlink,link,putenv,posix_kill,posix_mkfifo,posix_setuid,posix_setgid,posix_setsid,posix_setpgid,posix_getpwnam,posix_getpwuid,posix_uname,apache_child_terminate,apache_setenv,virtual

; 4. Restrict Filesystem Access to App & Temp Directories
open_basedir = /var/www/html:/tmp:/usr/local/lib/php:/.dockerenv

; 5. Session & Upload Progress Hardening
session.upload_progress.enabled = Off
session.use_strict_mode = On
session.use_cookies = On
session.use_only_cookies = On
session.use_trans_sid = Off
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = "Strict"

; 6. Resource Limits (DoS / Abuse Prevention)
max_execution_time = 30
max_input_time = 60
max_input_vars = 1000
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M
max_file_uploads = 5
