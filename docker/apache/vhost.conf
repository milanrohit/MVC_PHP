
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    DirectoryIndex index.php index.html

    # Restrict access to the public application directory.
    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted

        # Send unmatched application routes to the MVC front controller.
        FallbackResource /index.php
    </Directory>

    # Prevent Apache from exposing directory listings or signatures.
    ServerSignature Off

    # Security response headers.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    # Container-friendly Apache logs.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
