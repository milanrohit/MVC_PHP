<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    DirectoryIndex index.php index.html

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        # AllowOverride None is good for security/performance, keeping it as is
        AllowOverride None
        Require all granted

        # MOD_REWRITE MVC ROUTING (Replaces the broken FallbackResource)
        RewriteEngine On
        
        # If the requested filename is an actual file or directory, serve it directly
        RewriteCond %{REQUEST_FILENAME} -d [OR]
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]
        
        # Otherwise, send everything else to index.php safely
        RewriteRule ^ index.php [L]
    </Directory>

    # Prevent Apache from exposing directory listings or signatures.
    ServerSignature Off

    # Security response headers.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    # Container-friendly Apache logs.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
