; 1. Visual Debug Error Catching
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; 2. Ingestion Threshold Upgrades (Prevents 413 Payload Too Large)
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M

; 3. Buffer adjustments for local API responses
output_buffering = 4096
