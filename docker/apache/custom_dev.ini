[PHP]
; 1. Error Aggregation Controls (Never reveal system stack traces to users)
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; 2. Sizing Infrastructure (Optimized for asynchronous JSON array batches)
memory_limit = 256M
post_max_size = 30M
upload_max_filesize = 20M
max_input_vars = 3000

; 3. Engine Integrity Overrides
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

[Zend OPcache]
; 4. High-Performance Caching Layer (Drastically speeds up execution under PHP 8.5)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0 ; Set to 1 in development environments
opcache.save_comments = 1

; 5. Development Environment Overrides (Enable for local development, disable in production)
display_errors = On
display_startup_errors = On
log_errors = On
output_buffering = 4096
