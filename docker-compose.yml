services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    tty: true                          # <--- ADD THIS LINE TO KEEP IT ALIVE
    ports:
      - "${APP_PORT:-8080}:80"          # 8080 so it never fights XAMPP on :80
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db                        # container-to-container hostname
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mvc_app}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mvc_app}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"  # 3307 on host so it never fights XAMPP MySQL on :3306
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 🚀 ADD THIS NEW BLOCK BELOW YOUR EXISTING SERVICES
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mvc_phpmyadmin
    restart: always
    ports:
      - "8081:80"                      # Access the DB manager on browser port 8081
    environment:
      PMA_HOST: db                     # Directs phpMyAdmin to find your database container
      PMA_PORT: 3306                   # Uses internal container communication port
    depends_on:
      - db                             # Waits until the database engine boots

volumes:
  dbdata:
