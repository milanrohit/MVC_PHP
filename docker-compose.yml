# Hardened, production-like base.
# - no bind mounts, no dev ini, nothing published beyond localhost
# - dev conveniences live in docker-compose.override.yml (loaded automatically
#   by a plain `docker compose up`, but NOT by `-f docker-compose.yml`)
#
# Verify hardening:  COMPOSE_FILE=docker-compose.yml bash apply-and-verify.sh
# Needs a .env file (copy .env.example) that sets DB_ROOT_PASSWORD.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    restart: unless-stopped
    ports:
      # The production image runs Apache as non-root on 8080 (not 80)
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mvc_app}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      # Only storage/ is writable; application code stays read-only in the image
      - appstorage:/var/www/html/storage
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mvc_app}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    # No published port here: only the app container can reach MySQL.
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  appstorage:
