# Hardened, production-like base.
# - no bind mounts, no dev ini, nothing published beyond localhost
# - dev conveniences live in docker-compose.override.yml (loaded automatically
#   by a plain `docker compose up`, but NOT by `-f docker-compose.yml`)
#
# Verify hardening:  COMPOSE_FILE=docker-compose.yml bash apply-and-verify.sh
# Needs a .env file (copy .env.example) that sets DB_ROOT_PASSWORD and DB_PASSWORD.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    image: mvc_php:local
    restart: unless-stopped
    ports:
      # The production image runs Apache as non-root (uid 33) on 8080, not 80
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-mvc_app}
      # Least privilege: the app uses its own DB account, never MySQL root
      DB_USERNAME: ${DB_USERNAME:-mvc_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # Only storage/ is writable; application code stays read-only in the image
      - appstorage:/var/www/html/storage
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mvc_app}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      # Created automatically on first start with full rights on MYSQL_DATABASE only
      MYSQL_USER: ${DB_USERNAME:-mvc_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # No published port: only the app container can reach MySQL.
    volumes:
      - dbdata:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    healthcheck:
      # MYSQL_PWD keeps the password off the process list (unlike -p<password>)
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  # Public-facing side (host port mapping)
  frontend:
  # Private: no outbound internet, reachable only by containers on this network
  backend:
    internal: true

volumes:
  dbdata:
  appstorage:
