name: MVC_PHP DevOps CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
# Add "security-events: write" to a job only if it uploads SARIF results.
permissions:
  contents: read

# Cancel superseded pull-request runs; never cancel a push to main or dev.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with ARG PHP_VERSION in docker/php/Dockerfile.
  PHP_VERSION: "8.6"
  # Pinned so Semgrep engine/rule-format changes cannot break CI without a code change.
  # Bump deliberately: docker run --rm semgrep/semgrep:<new> semgrep --version
  SEMGREP_IMAGE: "semgrep/semgrep:1.174.0"
  APP_PORT: "8088"
  # NOTE: DB passwords are NOT set here. They are generated per run in the
  # "Generate DB passwords" step (the env context is not available at this level).

jobs:
  code-quality-and-sast:
    name: PHP Quality, Audit & SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, mbstring, zip
          tools: composer:v2
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Dependency Vulnerability Scan
        run: composer audit --locked

      - name: Run PHP_CodeSniffer (PSR-12)
        run: vendor/bin/phpcs --standard=phpcs.xml

      - name: Static Analysis (PHPStan)
        # Runs when a PHPStan config is committed (requires phpstan/phpstan in require-dev).
        if: hashFiles('phpstan.neon', 'phpstan.neon.dist', 'phpstan.dist.neon') != ''
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Unit Tests (PHPUnit)
        # Runs when a PHPUnit config is committed (requires phpunit/phpunit in require-dev).
        if: hashFiles('phpunit.xml', 'phpunit.xml.dist', 'phpunit.dist.xml') != ''
        run: vendor/bin/phpunit --no-coverage

      - name: Static Application Security Testing (Semgrep)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            "${SEMGREP_IMAGE}" \
            semgrep scan \
              --config p/php \
              --config p/owasp-top-ten \
              --config p/secrets \
              --exclude vendor \
              --metrics off \
              --error

  container-build-and-hardening:
    name: Build, Scan & Verify Hardened Container
    runs-on: ubuntu-latest
    needs: code-quality-and-sast
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Generated FIRST so every later step (including failure/cleanup steps)
      # sees the same values. Masked in logs; unique per run.
      - name: Generate DB passwords
        run: |
          for v in DB_ROOT_PASSWORD DB_PASSWORD; do
            p="$(openssl rand -hex 16)"
            echo "::add-mask::${p}"
            echo "${v}=${p}" >> "$GITHUB_ENV"
          done

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/php/Dockerfile
          config: .hadolint.yaml

      - name: Build Production Docker Image
        run: |
          docker build \
            --pull \
            --build-arg PHP_VERSION="${PHP_VERSION}" \
            -f docker/php/Dockerfile \
            --target production \
            -t mvc_php:ci \
            .

      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mvc_php:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Run Hardening Verification Script
        timeout-minutes: 15
        env:
          # Reuse the layer cache from the build step above (fresh runner, so it is
          # the same fresh build). Remove to force a --no-cache rebuild.
          QUICK: "1"
        run: |
          set -euo pipefail
          bash apply-and-verify.sh

      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps -a || true
          docker compose -f docker-compose.yml logs --no-color --tail 100 || true

      - name: Tear down containers
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans || true
