name: MVC_PHP DevOps CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write

jobs:
  code-quality-and-sast:
    name: PHP Quality, Audit & SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.6"
          extensions: pdo, pdo_mysql, mbstring
          tools: composer, phpcs

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Dependency Vulnerability Scan
        run: composer audit --locked

      - name: Run PHP_CodeSniffer (PSR-12)
        run: vendor/bin/phpcs --standard=phpcs.xml

      - name: Static Application Security Testing (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/php
            p/owasp-top-ten
            p/secrets

  container-build-and-hardening:
    name: Build, Scan & Verify Hardened Container
    runs-on: ubuntu-latest
    needs: code-quality-and-sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/php/Dockerfile

      - name: Build Production Docker Image
        run: |
          docker build \
            -f docker/php/Dockerfile \
            --target production \
            -t mvc_php:ci \
            .

      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "mvc_php:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Run Hardening Verification Script
        env:
          DB_ROOT_PASSWORD: "ci_temporary_strong_password_123!"
          APP_PORT: "8088"
        run: |
          chmod +x apply-and-verify.sh
          bash apply-and-verify.sh
