name: PHP DevOps Pipeline

on:
  pull_request:
    branches: [main, dev]

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP 8.6
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.6"
          tools: composer, phpstan

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Dependency Vulnerability Scan
        run: composer audit --locked

      - name: Static Analysis (PHPStan Level 8)
        run: vendor/bin/phpstan analyse --level=8

      - name: Automated Upgrade & Quality Check (Rector)
        run: vendor/bin/rector process --dry-run

      - name: SAST Scan (Semgrep OWASP PHP)
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/php
            p/owasp-top-ten
            p/secrets
